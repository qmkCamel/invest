<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">缠论学习图谱</title>
  <desc id="desc">缠论的递归级别、分型笔线段、中枢结构、背驰和买卖点。</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .card { fill: #ffffff; stroke: #d2dae6; stroke-width: 3; }
      .title { font: 800 92px "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; fill: #10213f; }
      .subtitle { font: 500 42px "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; fill: #53627a; }
      .card-title { font: 800 52px "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; fill: #10213f; }
      .label { font: 700 42px "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; fill: #21324d; }
      .small { font: 500 34px "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; fill: #5c6a80; }
      .tiny { font: 500 28px "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; fill: #718096; }
      .navy { stroke: #14315f; }
      .orange { stroke: #f97316; }
      .teal { stroke: #0f8b8d; }
      .blue { stroke: #2563eb; }
      .red { stroke: #d94841; }
      .axis { stroke: #d7deea; stroke-width: 3; }
      .grid { stroke: #e7ecf4; stroke-width: 2; }
      .zone { fill: #fff4e8; stroke: #f97316; stroke-width: 5; stroke-dasharray: 16 12; }
      .badge { fill: #10213f; }
    </style>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14315f"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f8b8d"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect class="bg" width="3840" height="2160"/>
  <circle cx="370" cy="200" r="125" fill="#fff2e6"/>
  <circle cx="3500" cy="1960" r="160" fill="#eaf6f6"/>

  <text class="title" x="1920" y="150" text-anchor="middle">缠论学习图谱</text>
  <text class="subtitle" x="1920" y="225" text-anchor="middle">精髓：用级别和中枢把走势结构化，在结构变化处观察买卖点</text>

  <!-- Panel 1 -->
  <g transform="translate(150 330)">
    <rect class="card" width="1740" height="760" rx="32"/>
    <circle class="badge" cx="82" cy="80" r="43"/>
    <text x="82" y="98" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">1</text>
    <text class="card-title" x="150" y="100">递归级别</text>

    <g transform="translate(140 185)">
      <text class="label" x="0" y="80">大级别</text>
      <text class="label" x="0" y="260" fill="#f97316">次级别</text>
      <text class="label" x="0" y="440" fill="#0f8b8d">小级别</text>

      <rect x="290" y="10" width="1240" height="500" rx="28" fill="#fbfcff" stroke="#d8e0ec" stroke-width="3"/>
      <path d="M 350 390 L 520 180 L 720 360 L 940 110 L 1160 300 L 1470 80" fill="none" class="navy" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 430 360 L 500 265 L 575 330 L 660 230 L 760 320 L 850 190 L 950 280 L 1040 170 L 1145 255 L 1230 150 L 1345 235" fill="none" class="orange" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 455 370 L 485 325 L 515 355 L 548 305 L 580 345 L 615 288 L 650 335 L 690 275 L 730 315 L 770 260 L 812 305 L 850 250 L 890 295 L 930 235 L 975 285 L 1020 220 L 1065 270 L 1115 215 L 1165 260 L 1210 205 L 1265 250 L 1320 198" fill="none" class="teal" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="small" x="910" y="585" text-anchor="middle">同一段走势可以在不同级别被重新拆解</text>
    </g>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(1950 330)">
    <rect class="card" width="1740" height="760" rx="32"/>
    <circle class="badge" cx="82" cy="80" r="43"/>
    <text x="82" y="98" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">2</text>
    <text class="card-title" x="150" y="100">分型-笔-线段</text>

    <g transform="translate(130 170)">
      <line class="axis" x1="0" y1="480" x2="1500" y2="480"/>
      <g stroke-width="5">
        <line x1="90" y1="350" x2="90" y2="470" stroke="#0f8b8d"/><rect x="65" y="380" width="50" height="70" fill="#0f8b8d"/>
        <line x1="170" y1="270" x2="170" y2="445" stroke="#d94841"/><rect x="145" y="300" width="50" height="100" fill="#d94841"/>
        <line x1="250" y1="190" x2="250" y2="430" stroke="#d94841"/><rect x="225" y="230" width="50" height="120" fill="#d94841"/>
        <line x1="330" y1="250" x2="330" y2="450" stroke="#0f8b8d"/><rect x="305" y="310" width="50" height="90" fill="#0f8b8d"/>
        <line x1="410" y1="330" x2="410" y2="500" stroke="#0f8b8d"/><rect x="385" y="360" width="50" height="85" fill="#0f8b8d"/>
        <line x1="490" y1="420" x2="490" y2="560" stroke="#0f8b8d"/><rect x="465" y="455" width="50" height="75" fill="#0f8b8d"/>
        <line x1="570" y1="320" x2="570" y2="510" stroke="#d94841"/><rect x="545" y="355" width="50" height="95" fill="#d94841"/>
        <line x1="650" y1="220" x2="650" y2="470" stroke="#d94841"/><rect x="625" y="265" width="50" height="130" fill="#d94841"/>
        <line x1="730" y1="280" x2="730" y2="485" stroke="#0f8b8d"/><rect x="705" y="335" width="50" height="95" fill="#0f8b8d"/>
        <line x1="810" y1="390" x2="810" y2="540" stroke="#0f8b8d"/><rect x="785" y="420" width="50" height="80" fill="#0f8b8d"/>
        <line x1="890" y1="300" x2="890" y2="500" stroke="#d94841"/><rect x="865" y="345" width="50" height="100" fill="#d94841"/>
        <line x1="970" y1="170" x2="970" y2="430" stroke="#d94841"/><rect x="945" y="220" width="50" height="130" fill="#d94841"/>
        <line x1="1050" y1="245" x2="1050" y2="465" stroke="#0f8b8d"/><rect x="1025" y="310" width="50" height="90" fill="#0f8b8d"/>
        <line x1="1130" y1="350" x2="1130" y2="520" stroke="#0f8b8d"/><rect x="1105" y="390" width="50" height="80" fill="#0f8b8d"/>
      </g>
      <path d="M 250 190 L 490 560 L 650 220 L 810 540 L 970 170 L 1130 520" fill="none" class="blue" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 250 190 L 490 560 L 970 170 L 1130 520" fill="none" class="orange" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 14"/>
      <circle cx="250" cy="190" r="18" fill="#2563eb"/>
      <circle cx="490" cy="560" r="18" fill="#f97316"/>
      <circle cx="970" cy="170" r="18" fill="#2563eb"/>
      <text class="label" x="185" y="115" fill="#2563eb">顶分型</text>
      <text class="label" x="425" y="640" fill="#f97316">底分型</text>
      <text class="label" x="635" y="170" fill="#2563eb">笔</text>
      <text class="label" x="1120" y="170" fill="#f97316">线段</text>
    </g>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(150 1160)">
    <rect class="card" width="1740" height="760" rx="32"/>
    <circle class="badge" cx="82" cy="80" r="43"/>
    <text x="82" y="98" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">3</text>
    <text class="card-title" x="150" y="100">中枢结构</text>

    <g transform="translate(120 160)">
      <line class="axis" x1="0" y1="520" x2="1500" y2="520"/>
      <rect class="zone" x="470" y="155" width="620" height="300" rx="18"/>
      <text class="label" x="780" y="320" text-anchor="middle" fill="#f97316">中枢</text>
      <path d="M 80 520 L 230 340 L 360 440 L 520 170 L 680 430 L 840 165 L 1010 440 L 1170 270 L 1380 95" fill="none" class="navy" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="520" cy="170" r="18" fill="#2563eb"/>
      <circle cx="680" cy="430" r="18" fill="#f97316"/>
      <circle cx="840" cy="165" r="18" fill="#2563eb"/>
      <circle cx="1010" cy="440" r="18" fill="#f97316"/>
      <line x1="1120" y1="245" x2="1390" y2="90" class="teal" stroke-width="9" marker-end="url(#arrow-teal)"/>
      <text class="label" x="1260" y="190" fill="#0f8b8d">离开</text>
      <line x1="1320" y1="140" x2="1120" y2="315" class="orange" stroke-width="9" marker-end="url(#arrow-orange)" stroke-dasharray="18 14"/>
      <text class="label" x="1190" y="395" fill="#f97316">回拉</text>
      <text class="small" x="780" y="610" text-anchor="middle">中枢用于判断盘整、离开、回拉与趋势延续</text>
    </g>
  </g>

  <!-- Panel 4 -->
  <g transform="translate(1950 1160)">
    <rect class="card" width="1740" height="760" rx="32"/>
    <circle class="badge" cx="82" cy="80" r="43"/>
    <text x="82" y="98" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">4</text>
    <text class="card-title" x="150" y="100">背驰与买卖点</text>

    <g transform="translate(135 170)">
      <line class="axis" x1="0" y1="350" x2="1490" y2="350"/>
      <line class="axis" x1="0" y1="535" x2="1490" y2="535"/>
      <path d="M 70 310 L 210 230 L 360 285 L 500 175 L 650 240 L 790 130 L 940 205 L 1080 105 L 1260 170 L 1420 85" fill="none" class="navy" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="360" cy="285" r="25" fill="#ffffff" stroke="#f97316" stroke-width="12"/>
      <circle cx="650" cy="240" r="25" fill="#ffffff" stroke="#f97316" stroke-width="12"/>
      <circle cx="1080" cy="105" r="25" fill="#ffffff" stroke="#f97316" stroke-width="12"/>
      <text class="label" x="315" y="375" fill="#f97316">一买</text>
      <text class="label" x="605" y="330" fill="#f97316">二买</text>
      <text class="label" x="1035" y="195" fill="#f97316">三买</text>
      <line x1="790" y1="130" x2="1420" y2="85" class="orange" stroke-width="6" stroke-dasharray="18 14"/>

      <g fill="#d94841">
        <rect x="120" y="455" width="34" height="80"/><rect x="175" y="430" width="34" height="105"/><rect x="230" y="400" width="34" height="135"/>
        <rect x="285" y="415" width="34" height="120"/><rect x="340" y="445" width="34" height="90"/><rect x="395" y="475" width="34" height="60"/>
        <rect x="690" y="450" width="34" height="85"/><rect x="745" y="425" width="34" height="110"/><rect x="800" y="405" width="34" height="130"/>
        <rect x="855" y="430" width="34" height="105"/><rect x="910" y="460" width="34" height="75"/><rect x="965" y="485" width="34" height="50"/>
        <rect x="1160" y="470" width="34" height="65"/><rect x="1215" y="450" width="34" height="85"/><rect x="1270" y="435" width="34" height="100"/>
        <rect x="1325" y="460" width="34" height="75"/><rect x="1380" y="490" width="34" height="45"/>
      </g>
      <line x1="230" y1="395" x2="1385" y2="430" class="navy" stroke-width="6" stroke-dasharray="18 14" marker-end="url(#arrow-navy)"/>
      <text class="label" x="1215" y="595" fill="#14315f">背驰</text>
      <text class="small" x="745" y="660" text-anchor="middle">价格新高或新低时，力度未同步增强，需要回到对应级别判断</text>
    </g>
  </g>

  <text class="tiny" x="1920" y="2050" text-anchor="middle">教育用途，不构成投资建议；缠论划分存在流派差异，实盘需要固定规则并记录复盘。</text>
</svg>
